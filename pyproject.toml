[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TSbench"
version = "0.1.2"
description = "A framework for benchmarking time series forecasting and generation models."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Francis Huot-Chantal" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "tqdm",
    "numpy",
    "pyarrow",
    "randomgen",
    "pandas",
    "torch",
    "matplotlib",
    "statsmodels",
    "scikit-learn",
    "scipy",
    "joblib",
]

[project.optional-dependencies]
test = ["flake8", "pytest", "pytest-cov", "setuptools"]
docs = ["sphinx", "sphinx-automodapi", "furo", "nbsphinx", "ipywidgets"]
R = ["rpy2[all]"]
all = [
    "flake8",
    "pytest",
    "pytest-cov",
    "setuptools",
    "sphinx",
    "sphinx-automodapi",
    "furo",
    "nbsphinx",
    "ipywidgets",
    "rpy2[all]",
]

[project.urls]
Homepage = "https://github.com/FrancisH-C/TSbench"

[tool.setuptools.packages.find]
include = ["TSbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
exclude = ["build", "**/node_modules", "**/__pycache__"]
ignore = ["build", "notebooks", "**/notebooks", "**/*.ipynb"]
defineConstant = { DEBUG = true }

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "B", "ARG"]
ignore = ["E999"]
